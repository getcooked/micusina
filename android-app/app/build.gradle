plugins {
    id 'com.android.application'
}

android {
    namespace 'com.micusina.app'
    compileSdk 35

    signingConfigs {
        release {
            storeFile file('../micusina-release.keystore')
            storePassword 'micusina123'
            keyAlias 'micusina'
            keyPassword 'micusina123'
        }
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.micusina.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'WEBSITE_URL', '"http://192.168.1.86:8000"'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
