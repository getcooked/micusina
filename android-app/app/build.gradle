plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.micusina.app'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    signingConfigs {
        release {
            storeFile file('../micusina-release.keystore')
            storePassword 'micusina123'
            keyAlias 'micusina'
            keyPassword 'micusina123'
        }
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.micusina.app'
        minSdk 24
        targetSdk 35
        versionCode 18
        versionName '2.7.0'
        buildConfigField 'String', 'API_BASE_URL', '"https://micusina-pos.com/api/mobile"'
        buildConfigField 'String', 'WEB_BASE_URL', '"https://micusina-pos.com"'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
