plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def setting = { String name, String fallback ->
    providers.gradleProperty(name).orNull ?:
        providers.environmentVariable(name).orNull ?:
        fallback
}

def baseUrl = { String name, String value, boolean allowHttp ->
    def normalized = value?.trim()?.replaceAll('/+$', '')
    def uri = normalized ? new URI(normalized) : null
    def allowedSchemes = allowHttp ? ['http', 'https'] : ['https']

    if (uri == null || !allowedSchemes.contains(uri.scheme?.toLowerCase()) || !uri.host) {
        throw new GradleException("${name} must be an absolute ${allowHttp ? 'HTTP(S)' : 'HTTPS'} URL.")
    }

    normalized
}

def debugApiBaseUrl = baseUrl(
    'MICUSINA_DEBUG_API_BASE_URL',
    setting('MICUSINA_DEBUG_API_BASE_URL', 'http://10.0.2.2:8000/api/mobile'),
    true
)
def debugWebBaseUrl = baseUrl(
    'MICUSINA_DEBUG_WEB_BASE_URL',
    setting('MICUSINA_DEBUG_WEB_BASE_URL', 'http://10.0.2.2:8000'),
    true
)
def releaseApiBaseUrl = baseUrl(
    'MICUSINA_RELEASE_API_BASE_URL',
    setting('MICUSINA_RELEASE_API_BASE_URL', 'https://micusina-pos.com/api/mobile'),
    false
)
def releaseWebBaseUrl = baseUrl(
    'MICUSINA_RELEASE_WEB_BASE_URL',
    setting('MICUSINA_RELEASE_WEB_BASE_URL', 'https://micusina-pos.com'),
    false
)

def releaseStoreFile = setting('MICUSINA_RELEASE_STORE_FILE', null)
def releaseStorePassword = setting('MICUSINA_RELEASE_STORE_PASSWORD', null)
def releaseKeyAlias = setting('MICUSINA_RELEASE_KEY_ALIAS', null)
def releaseKeyPassword = setting('MICUSINA_RELEASE_KEY_PASSWORD', null)
def releaseSigningValues = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
def releaseSigningConfigured = releaseSigningValues.every { it }

if (releaseSigningValues.any { it } && !releaseSigningConfigured) {
    throw new GradleException('Release signing is only partially configured. Set all four MICUSINA_RELEASE_* signing values.')
}

android {
    namespace = 'com.micusina.app'
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            create('release') {
                storeFile = rootProject.file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId = 'com.micusina.app'
        minSdk = 24
        targetSdk = 36
        versionCode = 19
        versionName = '3.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix = '.debug'
            versionNameSuffix = '-debug'
            buildConfigField 'String', 'API_BASE_URL', "\"${debugApiBaseUrl}\""
            buildConfigField 'String', 'WEB_BASE_URL', "\"${debugWebBaseUrl}\""
        }

        release {
            if (releaseSigningConfigured) {
                signingConfig = signingConfigs.getByName('release')
            }
            buildConfigField 'String', 'API_BASE_URL', "\"${releaseApiBaseUrl}\""
            buildConfigField 'String', 'WEB_BASE_URL', "\"${releaseWebBaseUrl}\""
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
