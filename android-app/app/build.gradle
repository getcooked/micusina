plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def setting = { String name, String fallback ->
    providers.gradleProperty(name).orNull ?:
        providers.environmentVariable(name).orNull ?:
        fallback
}

def baseUrl = { String name, String value, boolean allowHttp ->
    def normalized = value?.trim()?.replaceAll('/+$', '')
    def uri = normalized ? new URI(normalized) : null
    def allowedSchemes = allowHttp ? ['http', 'https'] : ['https']

    if (uri == null || !allowedSchemes.contains(uri.scheme?.toLowerCase()) || !uri.host) {
        throw new GradleException("${name} must be an absolute ${allowHttp ? 'HTTP(S)' : 'HTTPS'} URL.")
    }

    normalized
}

def debugApiBaseUrl = baseUrl(
    'MICUSINA_DEBUG_API_BASE_URL',
    setting('MICUSINA_DEBUG_API_BASE_URL', 'http://10.0.2.2:8000/api/mobile'),
    true
)
def debugWebBaseUrl = baseUrl(
    'MICUSINA_DEBUG_WEB_BASE_URL',
    setting('MICUSINA_DEBUG_WEB_BASE_URL', 'http://10.0.2.2:8000'),
    true
)
def releaseApiBaseUrl = baseUrl(
    'MICUSINA_RELEASE_API_BASE_URL',
    setting('MICUSINA_RELEASE_API_BASE_URL', 'https://micusina-pos.com/api/mobile'),
    false
)
def releaseWebBaseUrl = baseUrl(
    'MICUSINA_RELEASE_WEB_BASE_URL',
    setting('MICUSINA_RELEASE_WEB_BASE_URL', 'https://micusina-pos.com'),
    false
)

def signingSetting = { String name ->
    def propertyValue = providers.gradleProperty(name).orNull
    def environmentValue = providers.environmentVariable(name).orNull
    if (propertyValue && environmentValue && propertyValue != environmentValue) {
        throw new GradleException("Conflicting Gradle property and environment variable for ${name}. Remove the stale signing setting before building.")
    }
    propertyValue ?: environmentValue
}

def releaseStoreFile = signingSetting('MICUSINA_RELEASE_STORE_FILE')
def releaseStorePassword = signingSetting('MICUSINA_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = signingSetting('MICUSINA_RELEASE_KEY_ALIAS')
def releaseKeyPassword = signingSetting('MICUSINA_RELEASE_KEY_PASSWORD')
def releaseSigningValues = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
def releaseSigningConfigured = releaseSigningValues.every { it }

if (releaseSigningValues.any { it } && !releaseSigningConfigured) {
    throw new GradleException('Release signing is only partially configured. Set all four MICUSINA_RELEASE_* signing values.')
}

android {
    namespace = 'com.micusina.app'
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            create('release') {
                storeFile = rootProject.file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId = 'com.micusina.app'
        minSdk = 24
        targetSdk = 36
        versionCode = 20
        versionName = '3.1.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix = '.debug'
            versionNameSuffix = '-debug'
            buildConfigField 'String', 'API_BASE_URL', "\"${debugApiBaseUrl}\""
            buildConfigField 'String', 'WEB_BASE_URL', "\"${debugWebBaseUrl}\""
        }

        release {
            if (releaseSigningConfigured) {
                signingConfig = signingConfigs.getByName('release')
            }
            buildConfigField 'String', 'API_BASE_URL', "\"${releaseApiBaseUrl}\""
            buildConfigField 'String', 'WEB_BASE_URL', "\"${releaseWebBaseUrl}\""
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

// A normal release build may be unsigned for CI. Website downloads must never be.
def verifyWebsiteReleaseSigning = tasks.register('verifyWebsiteReleaseSigning') {
    group = 'distribution'
    description = 'Requires external production signing before staging a customer APK.'

    doLast {
        if (!releaseSigningConfigured) {
            throw new GradleException('Website APK staging requires all four MICUSINA_RELEASE_* signing values. The existing download has not been changed.')
        }
        if (!rootProject.file(releaseStoreFile).isFile()) {
            throw new GradleException('The configured release keystore does not exist. The existing download has not been changed.')
        }
    }
}

tasks.register('stageWebsiteApk') {
    group = 'distribution'
    description = 'Builds, verifies, and atomically stages the native signed release for website downloads. Does not deploy.'
    dependsOn verifyWebsiteReleaseSigning

    // Fail immediately without building an unsigned APK when signing is absent.
    if (releaseSigningConfigured) {
        dependsOn 'lintRelease', 'testDebugUnitTest', 'assembleRelease'
    }

    doLast {
        def apk = layout.buildDirectory.file('outputs/apk/release/app-release.apk').get().asFile
        if (!apk.isFile()) {
            throw new GradleException('The signed release APK was not produced. The existing download has not been changed.')
        }

        def windows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
        def buildTools = new File(android.sdkDirectory, "build-tools/${android.buildToolsVersion}")
        def javaExecutable = new File(System.getProperty('java.home'), "bin/java${windows ? '.exe' : ''}")
        def apkSigner = new File(buildTools, 'lib/apksigner.jar')
        def aapt = new File(buildTools, "aapt${windows ? '.exe' : ''}")
        if (![javaExecutable, apkSigner, aapt].every { it.isFile() }) {
            throw new GradleException('Android SDK signature/manifest verification tools are missing. The existing download has not been changed.')
        }

        // Capture verifier output instead of exposing certificate or tool details.
        def verifiedOutput = { List<String> command, String failure ->
            def output = new ByteArrayOutputStream()
            def result = project.exec {
                commandLine command
                standardOutput = output
                errorOutput = output
                ignoreExitValue = true
            }
            if (result.exitValue != 0) {
                throw new GradleException("${failure} The existing download has not been changed.")
            }
            output.toString('UTF-8')
        }

        def destination = rootProject.file('../public/downloads/Mi-Cusina.apk').toPath()
        java.nio.file.Files.createDirectories(destination.parent)
        def staged = java.nio.file.Files.createTempFile(destination.parent, '.Mi-Cusina-', '.apk.tmp')
        try {
            java.nio.file.Files.copy(apk.toPath(), staged, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            def certificate = verifiedOutput([
                javaExecutable.absolutePath, '-jar', apkSigner.absolutePath,
                'verify', '--verbose', '--print-certs', staged.toString(),
            ], 'Release APK signature verification failed.')
            if (!(certificate =~ /(?m)^Signer #\d+ certificate DN: /).find()
                || (certificate =~ /(?i)Android\s+Debug/).find()) {
                throw new GradleException('A verified production signing certificate is required; Android Debug certificates are not accepted. The existing download has not been changed.')
            }

            def manifest = verifiedOutput([
                aapt.absolutePath, 'dump', 'badging', staged.toString(),
            ], 'Release APK manifest verification failed.')
            if ((manifest =~ /(?m)^application-debuggable/).find()
                || !(manifest =~ /(?m)^package: name='com\.micusina\.app' /).find()
                || !(manifest =~ /(?m)^launchable-activity: name='com\.micusina\.app\.MainActivity' /).find()
                || !manifest.contains("versionCode='${android.defaultConfig.versionCode}'")) {
                throw new GradleException('Website downloads require the current non-debuggable native Mi Cusina release with MainActivity. The existing download has not been changed.')
            }

            // Both files are on the same filesystem; require an atomic replacement.
            // If verification or replacement fails, the old customer APK stays intact.
            java.nio.file.Files.move(staged, destination,
                java.nio.file.StandardCopyOption.ATOMIC_MOVE,
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            logger.lifecycle('Verified native release staged at public/downloads/Mi-Cusina.apk. Commit/deploy separately to update the live website.')
        } finally {
            java.nio.file.Files.deleteIfExists(staged)
        }
    }
}
