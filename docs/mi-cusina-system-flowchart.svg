<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1900" viewBox="0 0 1400 1900">
  <style>
    text { font-family: Arial, sans-serif; fill: #1f2937; text-anchor: middle; font-size: 17px; }
    .title { font-size: 30px; font-weight: bold; }
    .section { font-size: 21px; font-weight: bold; text-anchor: start; fill: #7f1d1d; }
    .process { fill: #fef3c7; stroke: #92400e; stroke-width: 2; }
    .io { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
    .decision { fill: #fce7f3; stroke: #be185d; stroke-width: 2; }
    .data { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }
    .term { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; }
    .connector { fill: #fff; stroke: #374151; stroke-width: 2; }
    .line { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .yesno { font-size: 14px; font-weight: bold; fill: #374151; }
    .note { font-size: 14px; text-anchor: start; }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs>

  <rect width="1400" height="1900" fill="#fffdf8"/>
  <text x="700" y="48" class="title">Mi Cusina System Flowchart</text>
  <text x="700" y="74" font-size="14">Web application + Flutter mobile application</text>

  <!-- legend -->
  <text x="55" y="116" class="section">Symbol key</text>
  <rect x="55" y="132" width="145" height="45" rx="23" class="term"/><text x="127" y="160">Start / End</text>
  <polygon points="245,132 390,132 375,177 230,177" class="io"/><text x="310" y="160">Input / Output</text>
  <rect x="430" y="132" width="145" height="45" class="process"/><text x="502" y="160">Process</text>
  <polygon points="660,132 715,177 660,222 605,177" class="decision"/><text x="660" y="180">Decision</text>
  <ellipse cx="820" cy="143" rx="72" ry="12" class="data"/><path d="M748 143v32c0 16 144 16 144 0v-32" class="data"/><text x="820" y="166">Database</text>
  <circle cx="1015" cy="155" r="23" class="connector"/><text x="1015" y="161">1</text>

  <!-- customer flow -->
  <text x="55" y="270" class="section">1. Customer access and ordering</text>
  <rect x="565" y="292" width="270" height="55" rx="28" class="term"/><text x="700" y="326">Start: Open website or mobile app</text>
  <path d="M700 347V378" class="line"/>
  <polygon points="545,380 825,380 805,435 525,435" class="io"/><text x="675" y="413">View food menu</text>
  <path d="M675 435V470" class="line"/>
  <polygon points="675,470 760,535 675,600 590,535" class="decision"/><text x="675" y="532">Add item</text><text x="675" y="553">to cart?</text>
  <path d="M590 535H400V605" class="line"/><text x="470" y="526" class="yesno">No</text>
  <path d="M675 600V635" class="line"/><text x="690" y="620" class="yesno">Yes</text>
  <rect x="510" y="637" width="330" height="55" class="process"/><text x="675" y="670">Validate stock and update cart</text>
  <path d="M675 692V727" class="line"/>
  <ellipse cx="675" cy="738" rx="145" ry="13" class="data"/><path d="M530 738v36c0 17 290 17 290 0v-36" class="data"/><text x="675" y="765">Carts and Foods records</text>
  <path d="M400 605V790H675" class="line"/>
  <path d="M675 785V820" class="line"/>
  <polygon points="675,820 760,885 675,950 590,885" class="decision"/><text x="675" y="882">Proceed to</text><text x="675" y="903">checkout?</text>
  <path d="M760 885H1015V950" class="line"/><text x="870" y="875" class="yesno">No</text>
  <path d="M675 950V985" class="line"/><text x="690" y="970" class="yesno">Yes</text>
  <polygon points="490,987 860,987 840,1047 470,1047" class="io"/><text x="665" y="1023">Enter delivery details and payment method</text>
  <path d="M665 1047V1082" class="line"/>
  <rect x="465" y="1084" width="400" height="60" class="process"/><text x="665" y="1110">Create grouped orders; deduct stock;</text><text x="665" y="1130">clear cart</text>
  <path d="M665 1144V1179" class="line"/>
  <ellipse cx="665" cy="1190" rx="175" ry="13" class="data"/><path d="M490 1190v36c0 17 350 17 350 0v-36" class="data"/><text x="665" y="1217">Orders, Foods, and Carts records</text>
  <path d="M665 1226V1265" class="line"/>
  <polygon points="520,1267 810,1267 790,1322 500,1322" class="io"/><text x="655" y="1300">Receipt and order tracking</text>
  <circle cx="1015" cy="975" r="23" class="connector"/><text x="1015" y="981">1</text>

  <!-- reservation -->
  <text x="55" y="1382" class="section">2. Reservation and online payment</text>
  <polygon points="115,1410 450,1410 430,1465 95,1465" class="io"/><text x="272" y="1443">Enter reservation details</text>
  <path d="M272 1465V1500" class="line"/>
  <rect x="95" y="1502" width="355" height="56" class="process"/><text x="272" y="1536">Create booking and 50% deposit</text>
  <path d="M272 1558V1593" class="line"/>
  <rect x="95" y="1595" width="355" height="56" class="process"/><text x="272" y="1629">Create PayMongo checkout session</text>
  <path d="M272 1651V1686" class="line"/>
  <polygon points="272,1688 357,1753 272,1818 187,1753" class="decision"/><text x="272" y="1750">Payment</text><text x="272" y="1771">confirmed?</text>
  <path d="M357 1753H505" class="line"/><text x="430" y="1742" class="yesno">No</text>
  <rect x="505" y="1725" width="235" height="56" class="process"/><text x="622" y="1759">Show payment error</text>
  <path d="M272 1818V1845" class="line"/><text x="287" y="1838" class="yesno">Yes</text>
  <ellipse cx="272" cy="1856" rx="168" ry="13" class="data"/><path d="M104 1856v27c0 17 336 17 336 0v-27" class="data"/><text x="272" y="1880">Booking: Paid and Pending</text>

  <!-- administration -->
  <text x="800" y="1382" class="section">3. Admin, staff, and rider work</text>
  <circle cx="1015" cy="1418" r="23" class="connector"/><text x="1015" y="1424">1</text>
  <path d="M1015 1441V1473" class="line"/>
  <polygon points="855,1475 1175,1475 1155,1530 835,1530" class="io"/><text x="1005" y="1508">Admin / staff order queue</text>
  <path d="M1005 1530V1565" class="line"/>
  <polygon points="1005,1565 1090,1630 1005,1695 920,1630" class="decision"/><text x="1005" y="1627">Assign an</text><text x="1005" y="1648">available rider?</text>
  <path d="M920 1630H815" class="line"/><text x="858" y="1620" class="yesno">No</text>
  <rect x="560" y="1602" width="255" height="56" class="process"/><text x="687" y="1636">Update payment or status</text>
  <path d="M1005 1695V1730" class="line"/><text x="1020" y="1715" class="yesno">Yes</text>
  <rect x="850" y="1732" width="310" height="56" class="process"/><text x="1005" y="1766">Assign rider; set On The Way</text>
  <path d="M1005 1788V1823" class="line"/>
  <polygon points="855,1825 1175,1825 1155,1880 835,1880" class="io"/><text x="1005" y="1858">Rider delivers; mark Delivered</text>
</svg>
